name: Windows migration

on:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "windows/**"
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "windows/**"

jobs:
  portable-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Validate contracts
        shell: pwsh
        run: ./windows/scripts/Test-Contracts.ps1
      - name: Build
        working-directory: windows
        run: dotnet build ./TeamsRecorder.Windows.sln --configuration Release
      - name: Test
        working-directory: windows
        run: dotnet run --project ./tests/Recorder.Core.Tests/Recorder.Core.Tests.csproj --configuration Release --no-build

  native-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        working-directory: windows/native
        run: cmake --preset windows-x64
      - name: Build
        working-directory: windows/native
        run: cmake --build --preset windows-x64-debug
      - name: Test
        working-directory: windows/native
        run: ctest --preset windows-x64-debug
