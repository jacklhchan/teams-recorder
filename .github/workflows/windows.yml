name: Windows migration

on:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "windows/**"
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "windows/**"

jobs:
  portable-core:
    # CMake presets intentionally target the VS 2022 generator. Pin the
    # runner rather than allowing windows-latest to move to a newer VS image.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Validate contracts
        shell: pwsh
        run: ./windows/scripts/Test-Contracts.ps1
      - name: Build Release native bridge
        working-directory: windows/native
        shell: pwsh
        run: |
          cmake --preset windows-x64
          cmake --build --preset windows-x64-release --target Recorder.NativeBridge
      - name: Build
        working-directory: windows
        run: dotnet build ./TeamsRecorder.Windows.sln --configuration Release
      - name: Test
        working-directory: windows
        run: dotnet run --project ./tests/Recorder.Core.Tests/Recorder.Core.Tests.csproj --configuration Release --no-build

  native-contract:
    # See portable-core: the native preset requires Visual Studio 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        working-directory: windows/native
        run: cmake --preset windows-x64
      - name: Build
        working-directory: windows/native
        run: cmake --build --preset windows-x64-debug
      - name: Test
        working-directory: windows/native
        run: ctest --preset windows-x64-debug
