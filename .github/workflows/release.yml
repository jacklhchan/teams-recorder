name: Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: CFBundleShortVersionString
        required: true
        type: string
      build_number:
        description: CFBundleVersion
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    environment: production
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_PROVENANCE_ID: github-actions:repo-${{ github.repository_id }}@${{ github.sha }}:run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify releasable ref
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production releases must run from main." >&2
            exit 64
          fi
      - name: Validate release inputs
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "Release version must contain two or three numeric components." >&2
            exit 64
          }
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Release build number must be a positive integer." >&2
            exit 64
          }
      - name: Run release gates
        run: |
          set -euo pipefail
          Tests/StorageSecurityGate/run.sh
          ./scripts/check-no-accessibility-api.sh
          swift test
          python3 -m unittest discover \
            -s Tests/ScriptTests \
            -p 'test_*.py' \
            -v
          Tests/PackagingTests/run-tests.sh
          Tests/VirtualMicDriverTests/run-tests.sh
          Tests/VirtualMicDriverTests/run-bundle-tests.sh
          Tests/VirtualMicDriverTests/run-script-tests.sh
      - name: Preflight required secrets
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MANIFEST_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_ED25519_PRIVATE_KEY_BASE64 }}
          PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
          MANIFEST_KEY_ID: ${{ vars.RELEASE_MANIFEST_KEY_ID }}
        run: |
          set -euo pipefail
          for value in "$P12" "$P12_PASSWORD" "$IDENTITY" \
            "$KEY_ID" "$ISSUER_ID" "$PRIVATE_KEY" "$MANIFEST_PRIVATE_KEY" "$MANIFEST_KEY_ID"; do
            test -n "$value" || {
              echo "A required production secret is missing." >&2
              exit 78
            }
          done
      - name: Configure temporary signing keychain
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MANIFEST_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/lmr-signing.keychain-db"
          ORIGINAL_KEYCHAINS="$RUNNER_TEMP/lmr-original-keychains"
          SIGNING_P12="$RUNNER_TEMP/signing.p12"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          MANIFEST_KEY="$RUNNER_TEMP/release-manifest-ed25519.key"
          /usr/bin/security list-keychains -d user > "$ORIGINAL_KEYCHAINS"
          echo "LMR_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "LMR_ORIGINAL_KEYCHAINS=$ORIGINAL_KEYCHAINS" >> "$GITHUB_ENV"
          echo "LMR_SIGNING_P12=$SIGNING_P12" >> "$GITHUB_ENV"
          echo "LMR_NOTARY_KEY=$NOTARY_KEY" >> "$GITHUB_ENV"
          echo "LMR_MANIFEST_KEY=$MANIFEST_KEY" >> "$GITHUB_ENV"
          load_original_keychains() {
            ORIGINAL_KEYCHAINS_ARRAY=()
            while IFS= read -r keychain || [[ -n "$keychain" ]]; do
              leading_whitespace="${keychain%%[![:space:]]*}"
              keychain="${keychain#"$leading_whitespace"}"
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              if [[ -n "$keychain" ]]; then
                ORIGINAL_KEYCHAINS_ARRAY+=("$keychain")
              fi
            done < "$ORIGINAL_KEYCHAINS"
          }
          configure_cleanup() {
            original_status=$?
            trap - ERR
            cleanup_status=0
            load_original_keychains || cleanup_status=$?
            set +u
            /usr/bin/security list-keychains -d user -s "${ORIGINAL_KEYCHAINS_ARRAY[@]}" || cleanup_status=$?
            set -u
            if [[ -e "$KEYCHAIN" ]]; then
              /usr/bin/security delete-keychain "$KEYCHAIN" || cleanup_status=$?
            fi
            /bin/rm -f \
              "$SIGNING_P12" \
              "$NOTARY_KEY" \
              "$MANIFEST_KEY" \
              "$ORIGINAL_KEYCHAINS" || cleanup_status=$?
            exit "$original_status"
          }
          trap configure_cleanup ERR
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "::add-mask::$MANIFEST_PRIVATE_KEY"
          printf '%s' "$P12" | /usr/bin/base64 --decode > "$SIGNING_P12"
          printf '%s' "$PRIVATE_KEY" | /usr/bin/base64 --decode > "$NOTARY_KEY"
          printf '%s' "$MANIFEST_PRIVATE_KEY" | /usr/bin/base64 --decode > "$MANIFEST_KEY"
          /bin/chmod 600 "$MANIFEST_KEY"
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/security set-keychain-settings -lut 21600 "$KEYCHAIN"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/security import "$SIGNING_P12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          load_original_keychains
          set +u
          /usr/bin/security list-keychains -d user -s "$KEYCHAIN" "${ORIGINAL_KEYCHAINS_ARRAY[@]}"
          set -u
          /usr/bin/xcrun notarytool store-credentials lmr-production \
            --key "$NOTARY_KEY" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --keychain "$KEYCHAIN"
          trap - ERR
      - name: Build, sign, notarize, and verify
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MANIFEST_KEY_ID: ${{ vars.RELEASE_MANIFEST_KEY_ID }}
        run: |
          set -euo pipefail
          ./scripts/build-release.sh \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --signing-identity "$SIGNING_IDENTITY" \
            --notary-profile lmr-production \
            --notary-keychain "$LMR_KEYCHAIN" \
            --manifest-key-id "$MANIFEST_KEY_ID" \
            --manifest-private-key-file "$LMR_MANIFEST_KEY" \
            --output-dir "$RUNNER_TEMP/release"
      - name: Verify portable checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          /usr/bin/shasum -a 256 -c ./*.sha256
      - name: Verify published release manifest
        run: |
          set -euo pipefail
          ./scripts/verify-release-manifest.sh \
            --manifest "$RUNNER_TEMP/release/Local-Meeting-Recorder-${RELEASE_VERSION}-${RELEASE_BUILD_NUMBER}.manifest.json" \
            --signature "$RUNNER_TEMP/release/Local-Meeting-Recorder-${RELEASE_VERSION}-${RELEASE_BUILD_NUMBER}.manifest.sig" \
            --zip "$RUNNER_TEMP/release/Local-Meeting-Recorder-${RELEASE_VERSION}-${RELEASE_BUILD_NUMBER}.zip" \
            --minimum-build "$RELEASE_BUILD_NUMBER"
      - name: Upload verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Local-Meeting-Recorder-${{ env.RELEASE_VERSION }}-${{ env.RELEASE_BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/*.manifest.json
            ${{ runner.temp }}/release/*.manifest.sig
            ${{ runner.temp }}/release/LICENSE
            ${{ runner.temp }}/release/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
      - name: Remove temporary credentials
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN="${LMR_KEYCHAIN:-$RUNNER_TEMP/lmr-signing.keychain-db}"
          ORIGINAL_KEYCHAINS_FILE="${LMR_ORIGINAL_KEYCHAINS:-$RUNNER_TEMP/lmr-original-keychains}"
          SIGNING_P12="${LMR_SIGNING_P12:-$RUNNER_TEMP/signing.p12}"
          NOTARY_KEY="${LMR_NOTARY_KEY:-$RUNNER_TEMP/AuthKey.p8}"
          MANIFEST_KEY="${LMR_MANIFEST_KEY:-$RUNNER_TEMP/release-manifest-ed25519.key}"
          load_original_keychains() {
            ORIGINAL_KEYCHAINS_ARRAY=()
            while IFS= read -r keychain || [[ -n "$keychain" ]]; do
              leading_whitespace="${keychain%%[![:space:]]*}"
              keychain="${keychain#"$leading_whitespace"}"
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              if [[ -n "$keychain" ]]; then
                ORIGINAL_KEYCHAINS_ARRAY+=("$keychain")
              fi
            done < "$ORIGINAL_KEYCHAINS_FILE"
          }
          cleanup_status=0
          if [[ -e "$ORIGINAL_KEYCHAINS_FILE" ]]; then
            load_original_keychains || cleanup_status=$?
            set +u
            /usr/bin/security list-keychains -d user -s "${ORIGINAL_KEYCHAINS_ARRAY[@]}" || cleanup_status=$?
            set -u
          fi
          if [[ -e "$KEYCHAIN" ]]; then
            /usr/bin/security delete-keychain "$KEYCHAIN" || cleanup_status=$?
          fi
          /bin/rm -f \
            "$SIGNING_P12" \
            "$NOTARY_KEY" \
            "$MANIFEST_KEY" \
            "$ORIGINAL_KEYCHAINS_FILE" || cleanup_status=$?
          exit "$cleanup_status"
